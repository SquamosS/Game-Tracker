name: Full release

# Run by hand once a version is stable: adds the installer to that version's
# release and promotes it from pre-release to the latest full release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Game Tracker v__VERSION__
          releaseBody: |
            Installer: unduh **Game.Tracker_*_x64-setup.exe**, jalankan, lalu ikuti langkah instalasi.
            Portable: unduh **GameTracker-portable-*.exe** dan jalankan langsung tanpa install.
          releaseDraft: false
          prerelease: false
      - name: Mark as latest full release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v$VERSION" --prerelease=false --latest
