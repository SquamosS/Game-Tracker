name: Release

# Every push to main publishes (or refreshes) the GitHub Release for the
# version in src-tauri/tauri.conf.json, with the Windows installer attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Game Tracker v__VERSION__
          releaseBody: |
            Unduh **Game.Tracker_*_x64-setup.exe** di bawah, jalankan, lalu ikuti langkah instalasi.
            Setelah terpasang, Game Tracker ada di Start Menu.
          releaseDraft: false
          prerelease: false
